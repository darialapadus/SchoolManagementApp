spring:
  datasource:
    url: jdbc:h2:mem:school_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

logging:
  level:
    com.example.school_managementv1: INFO
    org.hibernate.SQL: WARN
