<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Enroll student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="page-header">
        <h1>Enroll student in course</h1>
        <a th:href="@{/web/enrollments}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="form-card">
        <form th:action="@{/web/enrollments}" method="post" novalidate>
            <div class="form-group">
                <label>Student <span class="required">*</span></label>
                <select name="studentId" required>
                    <option value="">-- Select student --</option>
                    <option th:each="s : ${students}"
                            th:value="${s.id}"
                            th:text="${s.firstName} + ' ' + ${s.lastName} + ' (grade ' + ${s.gradeLevel} + ')'"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Course <span class="required">*</span></label>
                <select name="courseId" required>
                    <option value="">-- Select course --</option>
                    <option th:each="c : ${courses}"
                            th:value="${c.id}"
                            th:text="${c.name} + ' (' + ${c.credits} + ' cr.) — ' + ${c.teacher?.lastName}"></option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enroll</button>
                <a th:href="@{/web/enrollments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
