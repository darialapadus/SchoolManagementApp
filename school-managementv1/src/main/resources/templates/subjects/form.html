<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Edit subject' : 'New subject'">Subject</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Edit subject' : 'New subject'"></h1>
        <a th:href="@{/web/subjects}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="form-card">
        <form th:action="${isEdit} ? '/web/subjects/' + ${subject?.id} : '/web/subjects'" method="post" novalidate>
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" th:value="${isEdit}?${subject?.name}" required minlength="2" maxlength="100" placeholder="e.g. Mathematics"/>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" th:value="${isEdit}?${subject?.description}" maxlength="255" placeholder="Optional description"/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit}?'Save changes':'Add subject'"></button>
                <a th:href="@{/web/subjects}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
