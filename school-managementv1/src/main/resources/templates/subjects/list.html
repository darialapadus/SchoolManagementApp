<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Subjects — School Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div class="page-header">
        <h1>Academic Subjects</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/web/subjects/new}" class="btn btn-primary">+ Add subject</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th><a class="sort-link" th:href="@{/web/subjects(sort='name',dir=${sort=='name' and dir=='asc'?'desc':'asc'},size=${size})}">Name</a></th>
                <th>Description</th>
                <th>Teachers</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${page.content.empty}">
                <td colspan="5" class="table-empty">No subjects found.</td>
            </tr>
            <tr th:each="s, i : ${page.content}">
                <td th:text="${page.number * page.size + i.index + 1}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.description ?: '—'}" class="text-muted"></td>
                <td><span class="chip" th:text="${s.teachers.size()} + ' teacher(s)'"></span></td>
                <td sec:authorize="hasRole('ADMIN')" class="actions">
                    <a th:href="@{/web/subjects/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline">Edit</a>
                    <form th:action="@{/web/subjects/{id}/delete(id=${s.id})}" method="post"
                          onsubmit="return confirm('Delete this subject?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <a th:href="@{/web/subjects(page=0,size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">«</a>
        <a th:href="@{/web/subjects(page=${page.number-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">‹</a>
        <span th:each="i : ${#numbers.sequence(0,page.totalPages-1)}"
              th:if="${i>=page.number-2 and i<=page.number+2}">
            <a th:href="@{/web/subjects(page=${i},size=${size},sort=${sort},dir=${dir})}"
               th:text="${i+1}" th:classappend="${i==page.number}?'active'"></a>
        </span>
        <a th:href="@{/web/subjects(page=${page.number+1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">›</a>
        <a th:href="@{/web/subjects(page=${page.totalPages-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">»</a>
    </div>
</div>
</body>
</html>
