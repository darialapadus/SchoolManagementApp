<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Teachers — School Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div class="page-header">
        <h1>Teachers</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/web/teachers/new}" class="btn btn-primary">+ Add teacher</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th><a class="sort-link" th:href="@{/web/teachers(sort='firstName',dir=${sort=='firstName' and dir=='asc'?'desc':'asc'},size=${size})}">First name</a></th>
                <th><a class="sort-link" th:href="@{/web/teachers(sort='lastName', dir=${sort=='lastName'  and dir=='asc'?'desc':'asc'},size=${size})}">Last name</a></th>
                <th><a class="sort-link" th:href="@{/web/teachers(sort='email',    dir=${sort=='email'     and dir=='asc'?'desc':'asc'},size=${size})}">Email</a></th>
                <th><a class="sort-link" th:href="@{/web/teachers(sort='department',dir=${sort=='department' and dir=='asc'?'desc':'asc'},size=${size})}">Department</a></th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${page.content.empty}">
                <td colspan="6" class="table-empty">No teachers found.</td>
            </tr>
            <tr th:each="t, i : ${page.content}">
                <td th:text="${page.number * page.size + i.index + 1}"></td>
                <td th:text="${t.firstName}"></td>
                <td th:text="${t.lastName}"></td>
                <td th:text="${t.email}"></td>
                <td><span class="chip" th:text="${t.department}"></span></td>
                <td sec:authorize="hasRole('ADMIN')" class="actions">
                    <a th:href="@{/web/teachers/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline">Edit</a>
                    <form th:action="@{/web/teachers/{id}/delete(id=${t.id})}" method="post"
                          onsubmit="return confirm('Delete this teacher?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <a th:href="@{/web/teachers(page=0,size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">«</a>
        <a th:href="@{/web/teachers(page=${page.number-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">‹</a>
        <span th:each="i : ${#numbers.sequence(0,page.totalPages-1)}"
              th:if="${i>=page.number-2 and i<=page.number+2}">
            <a th:href="@{/web/teachers(page=${i},size=${size},sort=${sort},dir=${dir})}"
               th:text="${i+1}" th:classappend="${i==page.number}?'active'"></a>
        </span>
        <a th:href="@{/web/teachers(page=${page.number+1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">›</a>
        <a th:href="@{/web/teachers(page=${page.totalPages-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">»</a>
        <span class="pagination-info" th:text="${page.number*page.size+1}+'-'+${#numbers.min(page.number*page.size+page.size,page.totalElements)}+' of '+${page.totalElements}"></span>
    </div>
</div>
</body>
</html>
