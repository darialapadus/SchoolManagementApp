<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Edit teacher' : 'New teacher'">Teacher</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Edit teacher' : 'New teacher'"></h1>
        <a th:href="@{/web/teachers}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="form-card">
        <form th:action="${isEdit} ? '/web/teachers/' + ${teacher?.id} : '/web/teachers'" method="post" novalidate>
            <div class="form-group">
                <label>First name <span class="required">*</span></label>
                <input type="text" name="firstName" th:value="${isEdit}?${teacher?.firstName}" required minlength="2" maxlength="50" placeholder="e.g. John"/>
            </div>
            <div class="form-group">
                <label>Last name <span class="required">*</span></label>
                <input type="text" name="lastName" th:value="${isEdit}?${teacher?.lastName}" required minlength="2" maxlength="50" placeholder="e.g. Smith"/>
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" th:value="${isEdit}?${teacher?.email}" required placeholder="e.g. john.smith@school.com"/>
            </div>
            <div class="form-group">
                <label>Department <span class="required">*</span></label>
                <input type="text" name="department" th:value="${isEdit}?${teacher?.department}" required minlength="2" maxlength="80" placeholder="e.g. Computer Science"/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit}?'Save changes':'Add teacher'"></button>
                <a th:href="@{/web/teachers}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
