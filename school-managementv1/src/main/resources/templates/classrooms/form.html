<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Edit classroom' : 'New classroom'">Classroom</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Edit classroom' : 'New classroom'"></h1>
        <a th:href="@{/web/classrooms}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="form-card">
        <form th:action="${isEdit} ? '/web/classrooms/' + ${classroom?.id} : '/web/classrooms'" method="post" novalidate>
            <div class="form-group">
                <label>Building <span class="required">*</span></label>
                <input type="text" name="building" th:value="${isEdit}?${classroom?.building}" required minlength="1" maxlength="50" placeholder="e.g. Building A"/>
            </div>
            <div class="form-group">
                <label>Room number <span class="required">*</span></label>
                <input type="text" name="roomNumber" th:value="${isEdit}?${classroom?.roomNumber}" required minlength="1" maxlength="20" placeholder="e.g. 101"/>
            </div>
            <div class="form-group">
                <label>Capacity <span class="required">*</span></label>
                <input type="number" name="capacity" th:value="${isEdit}?${classroom?.capacity}" required min="1" placeholder="e.g. 30"/>
                <div class="form-hint">Minimum 1 seat</div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit}?'Save changes':'Add classroom'"></button>
                <a th:href="@{/web/classrooms}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
