<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Edit student' : 'New student'">Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Edit student' : 'New student'"></h1>
        <a th:href="@{/web/students}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="form-card">
        <form th:action="${isEdit} ? '/web/students/' + ${student?.id} : '/web/students'" method="post"
              novalidate>

            <div class="form-group">
                <label>First name <span class="required">*</span></label>
                <input type="text" name="firstName"
                       th:value="${isEdit} ? ${student?.firstName} : ${firstName}"
                       required minlength="2" maxlength="50"
                       placeholder="e.g. Anna"/>
                <div class="form-hint">2–50 characters</div>
            </div>

            <div class="form-group">
                <label>Last name <span class="required">*</span></label>
                <input type="text" name="lastName"
                       th:value="${isEdit} ? ${student?.lastName} : ${lastName}"
                       required minlength="2" maxlength="50"
                       placeholder="e.g. Smith"/>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email"
                       th:value="${isEdit} ? ${student?.email} : ${email}"
                       required maxlength="100"
                       placeholder="e.g. anna.smith@email.com"/>
            </div>

            <div class="form-group">
                <label>Grade level <span class="required">*</span></label>
                <input type="number" name="gradeLevel"
                       th:value="${isEdit} ? ${student?.gradeLevel} : ${gradeLevel}"
                       required min="1" max="12"
                       placeholder="1–12"/>
                <div class="form-hint">Value between 1 and 12</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"
                        th:text="${isEdit} ? 'Save changes' : 'Add student'"></button>
                <a th:href="@{/web/students}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const inputs = this.querySelectorAll('input[required]');
        for (let inp of inputs) {
            if (!inp.checkValidity()) {
                inp.reportValidity();
                e.preventDefault();
                return;
            }
        }
    });
</script>
</body>
</html>
