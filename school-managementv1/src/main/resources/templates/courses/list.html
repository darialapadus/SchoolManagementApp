<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Courses — School Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div class="page-header">
        <h1>Courses</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/web/courses/new}" class="btn btn-primary">+ Add course</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th><a class="sort-link" th:href="@{/web/courses(sort='name',dir=${sort=='name' and dir=='asc'?'desc':'asc'},size=${size})}">Name</a></th>
                <th><a class="sort-link" th:href="@{/web/courses(sort='credits',dir=${sort=='credits' and dir=='asc'?'desc':'asc'},size=${size})}">Credits</a></th>
                <th>Teacher</th>
                <th>Classroom</th>
                <th>Students</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${page.content.empty}">
                <td colspan="7" class="table-empty">No courses found.</td>
            </tr>
            <tr th:each="c, i : ${page.content}">
                <td th:text="${page.number * page.size + i.index + 1}"></td>
                <td th:text="${c.name}"></td>
                <td><span class="chip" th:text="${c.credits} + ' cr.'"></span></td>
                <td th:text="${c.teacher?.firstName} + ' ' + ${c.teacher?.lastName}"></td>
                <td th:text="${c.classroom?.building} + ' ' + ${c.classroom?.roomNumber}"></td>
                <td><span class="chip" th:text="${c.enrollments.size()}"></span></td>
                <td sec:authorize="hasRole('ADMIN')" class="actions">
                    <a th:href="@{/web/courses/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline">Edit</a>
                    <form th:action="@{/web/courses/{id}/delete(id=${c.id})}" method="post"
                          onsubmit="return confirm('Delete this course?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <a th:href="@{/web/courses(page=0,size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">«</a>
        <a th:href="@{/web/courses(page=${page.number-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.first}?'disabled'">‹</a>
        <span th:each="i : ${#numbers.sequence(0,page.totalPages-1)}"
              th:if="${i>=page.number-2 and i<=page.number+2}">
            <a th:href="@{/web/courses(page=${i},size=${size},sort=${sort},dir=${dir})}"
               th:text="${i+1}" th:classappend="${i==page.number}?'active'"></a>
        </span>
        <a th:href="@{/web/courses(page=${page.number+1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">›</a>
        <a th:href="@{/web/courses(page=${page.totalPages-1},size=${size},sort=${sort},dir=${dir})}" th:classappend="${page.last}?'disabled'">»</a>
    </div>
</div>
</body>
</html>
