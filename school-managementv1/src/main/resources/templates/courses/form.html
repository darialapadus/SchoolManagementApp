<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Edit course' : 'New course'">Course</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Edit course' : 'New course'"></h1>
        <a th:href="@{/web/courses}" class="btn btn-secondary">← Back</a>
    </div>
    <div class="form-card">
        <form th:action="${isEdit} ? '/web/courses/' + ${course?.id} : '/web/courses'" method="post" novalidate>
            <div class="form-group">
                <label>Course name <span class="required">*</span></label>
                <input type="text" name="name" th:value="${isEdit}?${course?.name}" required minlength="2" maxlength="100" placeholder="e.g. Algorithms and Data Structures"/>
            </div>
            <div class="form-group">
                <label>Credits <span class="required">*</span></label>
                <input type="number" name="credits" th:value="${isEdit}?${course?.credits}" required min="1" max="30" placeholder="e.g. 6"/>
            </div>
            <div class="form-group">
                <label>Teacher <span class="required">*</span></label>
                <select name="teacherId" required>
                    <option value="">-- Select teacher --</option>
                    <option th:each="t : ${teachers}"
                            th:value="${t.id}"
                            th:text="${t.firstName} + ' ' + ${t.lastName} + ' (' + ${t.department} + ')'"
                            th:selected="${isEdit and course?.teacher?.id == t.id}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Classroom <span class="required">*</span></label>
                <select name="classroomId" required>
                    <option value="">-- Select classroom --</option>
                    <option th:each="r : ${classrooms}"
                            th:value="${r.id}"
                            th:text="${r.building} + ' - ' + ${r.roomNumber} + ' (' + ${r.capacity} + ' seats)'"
                            th:selected="${isEdit and course?.classroom?.id == r.id}"></option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit}?'Save changes':'Add course'"></button>
                <a th:href="@{/web/courses}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
